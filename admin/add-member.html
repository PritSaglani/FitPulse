<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add member | FitPulse</title>
<link rel="stylesheet" href="../css/style.css"><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet"></head>
<body data-panel="admin" data-page="add-member"><main id="app"><h1>Add member</h1><p class="sub">Register a member and assign their plans.</p><div class="card"><form id="af"><div><label>Full name</label><input name="name" data-v="name"><span class="err"></span></div><div><label>Email</label><input name="email" data-v="email"><span class="err"></span></div><div><label>Phone</label><input name="phone" data-v="phone"><span class="err"></span></div>
<div><label>Goal</label><select name="goal" data-v="select"><option value="">Choose...</option><option>Fat loss</option><option>Muscle gain</option><option>Flexibility</option><option>Endurance</option></select><span class="err"></span></div>
<div><label>Workout plan</label><select id="workout" name="workout" data-v="select"></select><span class="err"></span></div>
<div><label>Diet plan</label><select id="diet" name="diet" data-v="select"></select><span class="err"></span></div>
<div><label>Password</label><input id="pw" name="password" type="password" data-v="password pattern"><span class="err"></span></div><div><label>Confirm password</label><input name="confirm" type="password" data-v="req match" data-match="pw"><span class="err"></span></div><div class="full"><button class="btn">Add member</button></div></form></div></main>
<script src="../js/data.js"></script><script src="../js/layout.js"></script><script src="../js/validate.js"></script><script src="../js/pages.js"></script></body></html>
